name: Deploy

on:
  workflow_dispatch:
    inputs:
      kurohelperservice_ref:
        description: 'kurohelper-service 依賴使用的版本 ref'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read
  actions: read

jobs:
  build:
    permissions:
      contents: read
      actions: write
    uses: kuro-helper/.github/.github/workflows/go-build.yml@main
    with:
      use_kurohelperservice: ${{ inputs.kurohelperservice_ref }}
      linux_binary_name: ${{ format('{0}-linux-amd64', github.event.repository.name) }}

  deploy:
    needs: build
    permissions:
      contents: read
      actions: write
    uses: kuro-helper/.github/.github/workflows/go-deploy.yml@main
    with:
      linux_binary_name: ${{ format('{0}-linux-amd64', github.event.repository.name) }}
      systemd_service: ${{ github.event.repository.name }}
    secrets: inherit
